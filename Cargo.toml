[workspace]
members = [
    "apps/stassh",
    "apps/stassh-tui",
    "crates/stassh-core",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/arturormk/stassh-rust"

[workspace.dependencies]
anyhow = "1.0.95"
clap = { version = "4.5.31", features = ["derive"] }
crossterm = "0.28.1"
libc = "0.2.169"
ratatui = "0.29.0"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
thiserror = "2.0.11"
uuid = { version = "1.12.1", features = ["v4", "serde"] }
