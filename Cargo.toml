[workspace]
members = [
    "apps/stassh",
    "apps/stassh-tui",
    "crates/stassh-core",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/arturormk/stassh-rust"

[workspace.dependencies]
anyhow = "1.0.95"
argon2 = "0.5.3"
base64 = "0.22.1"
chacha20poly1305 = "0.10.1"
clap = { version = "4.5.31", features = ["derive"] }
crossterm = "0.28.1"
libc = "0.2.169"
rand_core = { version = "0.6.4", features = ["getrandom"] }
ratatui = "0.29.0"
rpassword = "7.3.1"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
tempfile = "3.14.0"
thiserror = "2.0.11"
uuid = { version = "1.12.1", features = ["v4", "serde"] }
zeroize = { version = "1.8.1", features = ["derive"] }
